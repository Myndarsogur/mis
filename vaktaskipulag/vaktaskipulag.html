<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaktaskipulag</title>
<style>
:root{--ink:#17202a;--muted:#687582;--line:#dce3e9;--bg:#f5f7fa;--card:#fff;--accent:#6d52d9;--accent2:#f0ecff;--shadow:0 10px 30px #24344b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1500px;margin:auto;padding:24px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.eyebrow{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:11px}.title{font-size:30px;font-weight:850;margin:2px 0}.sub{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:700;color:var(--ink)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:#b42318}.toolbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:end;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:18px}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.field input,.field select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-weight:700}.stat strong{display:block;font-size:25px;margin-top:2px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.cardhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.cardhead h2{font-size:18px;margin:0}.scroll{overflow:auto}.day{border-bottom:1px solid var(--line);min-width:950px}.day:last-child{border-bottom:0}.dayhead{background:#fbfcfd;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;position:sticky;left:0}.daytitle{font-weight:850}.daytitle span{color:var(--muted);font-weight:500;margin-left:7px}.fill{font-size:12px;color:var(--muted)}.slots{display:grid;grid-template-columns:repeat(14,minmax(130px,1fr));gap:8px;padding:12px 18px 18px}.slot{border:1px solid var(--line);border-top:5px solid var(--slot,#8a96a3);border-radius:11px;padding:10px;background:#fff;min-height:126px;transition:.15s}.slot:hover{transform:translateY(-2px);box-shadow:0 5px 15px #24344b15}.slotnum{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:800}.slot select{width:100%;margin:9px 0 7px;border:1px solid var(--line);border-radius:7px;padding:6px;background:#fff}.role{font-size:12px;font-weight:750}.time{font-size:12px;color:var(--muted);margin-top:3px}.edit{margin-top:7px;padding:5px 7px;border-radius:6px;background:#f2f4f7;color:#52606d;font-size:11px;font-weight:700}.sidebody{padding:12px 16px}.employee-list{margin:0;padding:0;list-style:none}.employee-list li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #edf0f3}.employee-list li:last-child{border:0}.employee-name{font-weight:750}.hours{color:var(--accent);font-weight:850;white-space:nowrap}.copybox{width:100%;min-height:175px;border:1px solid var(--line);border-radius:9px;padding:10px;resize:vertical;font-size:12px;font-family:ui-monospace,monospace;background:#fbfcfd}.hint{font-size:12px;color:var(--muted);margin:9px 0 0}.legend{display:flex;gap:9px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}.legend span{font-size:11px;display:flex;gap:5px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}.modalback{position:fixed;inset:0;background:#10172288;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalback.open{display:flex}.modal{background:#fff;border-radius:16px;max-width:470px;width:100%;padding:20px;box-shadow:0 20px 70px #0004}.modal h3{margin:0 0 15px;font-size:20px}.modalgrid{display:grid;gap:12px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{padding:45px;text-align:center;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.app{padding:14px}.topbar{display:block}.actions{margin-top:12px}.stats{grid-template-columns:1fr}.toolbar{align-items:stretch}.field{flex:1;min-width:130px}.dayhead{position:static}.slots{grid-template-columns:repeat(14,125px)}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div><div class="eyebrow">Vaktaskipulag · frístundaheimili</div><div class="title">Vaktir og vinnutímar</div><p class="sub">Veldu tímabil, úthlutaðu 14 stöðum á dag og fylgstu með heildartímum.</p></div><div class="actions"><button class="btn" id="demoBtn">Hlaða sýnidæmi</button><button class="btn danger" id="clearBtn">Hreinsa gögn</button></div></header>
<section class="toolbar"><div class="field"><label>Frá</label><input id="from" type="date"></div><div class="field"><label>Til</label><input id="to" type="date"></div><div class="field"><label>Vaktalengd</label><select id="shiftLen"><option value="4">4 klst.</option><option value="5">5 klst.</option><option value="6">6 klst.</option><option value="7">7 klst.</option><option value="8">8 klst.</option></select></div><button class="btn primary" id="applyBtn">Sýna tímabil</button><button class="btn" id="copyBtn">Afrita starfsmannalista</button></section>
<section class="stats"><div class="stat"><small>Virkir dagar</small><strong id="dayCount">0</strong></div><div class="stat"><small>Úthlutaðar stöður</small><strong id="assignedCount">0 / 0</strong></div><div class="stat"><small>Skráðir starfsmenn</small><strong id="employeeCount">0</strong></div></section>
<div class="layout"><section class="card"><div class="cardhead"><h2>Dagatal og stöður</h2><span class="fill" id="rangeText"></span></div><div class="scroll" id="calendar"></div><div class="legend" id="legend"></div></section><aside class="card"><div class="cardhead"><h2>Heildartímar</h2><button class="btn" id="addEmpBtn">+ Starfsmaður</button></div><div class="sidebody"><ul class="employee-list" id="employeeList"></ul><textarea class="copybox" id="copyText" readonly aria-label="Afritunarlisti"></textarea><p class="hint">Smelltu á „Afrita“ til að setja listann á klemmuspjaldið.</p></div></aside></div>
</main>
<div class="modalback" id="modalBack"><div class="modal"><h3 id="modalTitle">Hlutverk</h3><div class="modalgrid"><div class="field"><label>Heiti hlutverks</label><input id="roleName"></div><div class="field"><label>Starfslýsing / nánari upplýsingar</label><textarea id="roleDesc" rows="5" style="border:1px solid var(--line);border-radius:9px;padding:9px;resize:vertical"></textarea></div><div class="field"><label>Litur</label><input id="roleColor" type="color" value="#6d52d9" style="height:40px;padding:3px"></div></div><div class="modalfoot"><button class="btn" id="cancelModal">Loka</button><button class="btn primary" id="saveModal">Vista</button></div></div></div>
<script>
const KEY='vaktaskipulag-v1';
const defaultEmployees=['Anna','Björn','Elín','Guðrún','Jón','Katrín','Magnús','Sara'];
const defaultRoles=[['Móttaka','Tekur á móti börnum, skráir komu og heldur yfirsýn.','#6d52d9'],['Útisvæði','Umsjón með stóra garðinum og virku útileikjasvæði.','#0b8f73'],['Litli garður','Sandkassi og frjáls leikur; styður rólega þátttöku.','#e08a22'],['Kósý garður','Fjarlæg vöktun og skapandi leikur í leynigarðinum.','#d5536b'],['Föndur og fjör','Skipuleggur föndur, smíði og skapandi verkefni.','#a33fc1'],['Music & science','Tilraunir, tónlist og hljóðræn uppgötvun.','#2474c6'],['Hugmyndakassi','Tekur við hugmyndum barnanna og þróar verkefni.','#8a6a35'],['Matsalur','Máltíðir, frágangur og róleg umskipti.','#51606f'],['Sandkassar','Skipulagður sandleikur í litlu hópunum.','#9b7b45'],['Hreyfing','Leikir, hreyfing og örugg notkun pogo-svæðis.','#e0492f'],['Námsaðstoð','Stuðningur við læsi, heimanám og rólega vinnu.','#3d7c98'],['Sérstuðningur','Einstaklingsmiðaður stuðningur og skýr samskipti.','#c13d82'],['Flot / afleysing','Tekur við þar sem þörf er á hverju sinni.','#65717e'],['Lokavakt','Frágangur, talning og tryggir örugga lokun dagsins.','#344054']];
let state=load();let editing=null;
function iso(d){return d.toISOString().slice(0,10)} function today(){return iso(new Date())}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}} function fresh(){return{from:today(),to:today(),shiftLen:4,employees:[...defaultEmployees],roles:defaultRoles.map(x=>({name:x[0],desc:x[1],color:x[2]})),assignments:{}}} function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const $=id=>document.getElementById(id); function dates(){let a=new Date(state.from+'T12:00:00'),b=new Date(state.to+'T12:00:00'),out=[];if(a>b)return out;for(;a<=b;a.setDate(a.getDate()+1))out.push(iso(a));return out}
function fmt(x){return new Intl.DateTimeFormat('is-IS',{weekday:'long',day:'numeric',month:'long'}).format(new Date(x+'T12:00:00'))}
function key(d,i){return d+'_'+i} function getA(d,i){return state.assignments[key(d,i)]||{employee:'',start:'13:00',end:'17:00'}}
function render(){ $('from').value=state.from;$('to').value=state.to;$('shiftLen').value=state.shiftLen;let ds=dates();$('dayCount').textContent=ds.length;$('rangeText').textContent=ds.length?fmt(ds[0])+' – '+fmt(ds.at(-1)): 'Ógilt tímabil';$('employeeCount').textContent=state.employees.length;let total=ds.length*14,assigned=0;let cal=$('calendar');cal.innerHTML='';if(!ds.length){cal.innerHTML='<div class="empty">Veldu gilt dagsetningabil.</div>'}ds.forEach(d=>{let used=0;let day=document.createElement('div');day.className='day';let head=document.createElement('div');head.className='dayhead';head.innerHTML='<div class="daytitle">'+fmt(d)+' <span>'+d+'</span></div><div class="fill" data-fill="'+d+'"></div>';day.appendChild(head);let slots=document.createElement('div');slots.className='slots';for(let i=0;i<14;i++){let a=getA(d,i);if(a.employee)assigned++,used++;let role=state.roles[i];let s=document.createElement('div');s.className='slot';s.style.setProperty('--slot',role.color);s.innerHTML='<div class="slotnum"><span>STAÐA '+(i+1)+'</span><span>'+role.name+'</span></div><select data-d="'+d+'" data-i="'+i+'"><option value="">— Óúthlutað —</option>'+state.employees.map(e=>'<option '+(e===a.employee?'selected':'')+'>'+e+'</option>').join('')+'</select><div class="role">'+role.name+'</div><div class="time">'+a.start+'–'+a.end+' · '+state.shiftLen+' klst.</div><button class="edit" data-edit="'+i+'">Skoða hlutverk</button>';slots.appendChild(s)}day.appendChild(slots);cal.appendChild(day);setTimeout(()=>{let el=document.querySelector('[data-fill="'+d+'"]');if(el)el.textContent=used+' / 14 úthlutaðar'},0)});$('assignedCount').textContent=assigned+' / '+total;renderEmployees();renderLegend()}
function renderEmployees(){let totals=Object.fromEntries(state.employees.map(e=>[e,0]));Object.values(state.assignments).forEach(a=>{if(a.employee&&totals[a.employee]!=null)totals[a.employee]+=Number(state.shiftLen)||0});let sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);$('employeeList').innerHTML=sorted.map(([e,h])=>'<li><span class="employee-name">'+e+'</span><span class="hours">'+h+' klst.</span></li>').join('')||'<li>Engir starfsmenn</li>';$('copyText').value=sorted.map(([e,h])=>e+'\t'+h+' klst.').join('\n')}
function renderLegend(){$('legend').innerHTML=state.roles.map(r=>'<span><i class="dot" style="--c:'+r.color+'"></i>'+r.name+'</span>').join('')}
$('applyBtn').onclick=()=>{state.from=$('from').value;state.to=$('to').value;state.shiftLen=Number($('shiftLen').value);save();render()};$('calendar').onchange=e=>{if(e.target.matches('select')){let k=key(e.target.dataset.d,e.target.dataset.i);state.assignments[k]={...getA(e.target.dataset.d,Number(e.target.dataset.i)),employee:e.target.value};save();render()}};$('calendar').onclick=e=>{let b=e.target.closest('[data-edit]');if(!b)return;editing=Number(b.dataset.edit);let r=state.roles[editing];$('modalTitle').textContent='Staða '+(editing+1)+' · '+r.name;$('roleName').value=r.name;$('roleDesc').value=r.desc;$('roleColor').value=r.color;$('modalBack').classList.add('open')};$('cancelModal').onclick=()=>{$('modalBack').classList.remove('open')};$('saveModal').onclick=()=>{let r=state.roles[editing];r.name=$('roleName').value.trim()||r.name;r.desc=$('roleDesc').value.trim();r.color=$('roleColor').value;save();$('modalBack').classList.remove('open');render()};$('addEmpBtn').onclick=()=>{let n=prompt('Nafn starfsmanns:');if(n&&n.trim()&&!state.employees.includes(n.trim())){state.employees.push(n.trim());save();render()}};$('copyBtn').onclick=()=>{navigator.clipboard?.writeText($('copyText').value);$('copyBtn').textContent='Afritað ✓';setTimeout(()=>$('copyBtn').textContent='Afrita starfsmannalista',1500)};$('demoBtn').onclick=()=>{state=fresh();state.from=new Date().toISOString().slice(0,10);let d=state.from;state.employees.forEach((e,i)=>{state.assignments[key(d,i)]={employee:e,start:'13:00',end:'17:00'}});save();render()};$('clearBtn').onclick=()=>{if(confirm('Hreinsa allar úthlutanir og starfsmenn?')){state=fresh();save();render()}};render();
</script>
</body></html>
