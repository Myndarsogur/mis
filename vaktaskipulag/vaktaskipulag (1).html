<!doctype html><html lang="is"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaktaskipulag</title><style>
:root{--a:#7357dc;--bg:#f5f7fb;--line:#dce3e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui;color:#18202a}.app{max-width:1450px;margin:auto;padding:22px}h1{margin:0;font-size:28px}.sub{color:#687582}.toolbar,.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 24px #2345 1;padding:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}.field{display:grid;gap:4px}.field label{font-size:10px;color:#687582;text-transform:uppercase;font-weight:800}.field input,.field select{padding:8px;border:1px solid var(--line);border-radius:8px}.btn,.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.primary,.tab.on{background:var(--a);color:#fff}.tabs{display:flex;gap:6px;margin-bottom:14px}.layout{display:grid;grid-template-columns:245px 1fr;gap:16px}.card{padding:0;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.body{padding:13px}.people{display:grid;gap:8px}.person{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c,#7357dc);padding:9px;border-radius:10px;cursor:grab;box-shadow:0 3px 10px #2345 1}.person small{display:block;color:#687582;font-size:11px}.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;padding:13px;overflow:auto}.day{min-width:150px;background:#f7f9fb;border:1px solid var(--line);border-radius:10px}.day h3{margin:0;padding:9px;background:#eef1f5;font-size:13px}.stations{display:grid;gap:7px;padding:8px}.station{min-height:83px;background:#fff;border:2px dashed #ccd4dd;border-radius:9px;padding:7px}.station.over{border-color:var(--a);background:#f0edff}.station b{display:block;font-size:11px;color:#687582}.station p{font-size:11px;margin:3px 0}.dropcards .person{padding:5px;font-size:11px;border-left-width:4px}.month{padding:14px}.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.monthgrid div{min-height:70px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px}.monthgrid .head{min-height:20px;border:0;background:transparent;color:#687582}.has{background:linear-gradient(135deg,var(--theme1),#fff)!important}.stats{display:flex;gap:8px;margin:0 0 14px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px}.stat small{display:block;color:#687582}.stat strong{font-size:19px}@media(max-width:800px){.layout{grid-template-columns:1fr}.week{grid-template-columns:repeat(7,155px)}}
</style><main class="app"><header style="display:flex;justify-content:space-between"><div><div style="color:var(--a);font-size:11px;font-weight:800;text-transform:uppercase">Vaktaskipulag · myndrænt stjórnborð</div><h1>Stöðvar, fólk og tímar</h1><p class="sub">Dragðu starfsmannaspjöld á stöðvar.</p></div><div><button class="btn" id="demo">Sýnidæmi</button> <button class="btn" id="clear">Hreinsa</button></div></header><section class="toolbar"><div class="field"><label>Frá</label><input id="from" type="date"></div><div class="field"><label>Til</label><input id="to" type="date"></div><div class="field"><label>Vinnutími</label><select id="preset"><option value="2">14:00–16:00</option><option value="4">13:30–17:30</option><option value="custom">Handskráður tími</option></select></div><div class="field"><label>Handskráð frá</label><input id="cf" type="time" value="13:30"></div><div class="field"><label>Handskráð til</label><input id="ct" type="time" value="17:30"></div><div class="field"><label>Mánaðarþema</label><select id="theme"><option value="unicorn">Einhyrningamánuður</option><option value="stars">Stjörnumánuður</option><option value="christmas">Jólamánuður</option><option value="plain">Einfalt</option></select></div><button class="btn primary" id="apply">Uppfæra</button></section><nav class="tabs"><button class="tab on" data-v="week">Vikusýn</button><button class="tab" data-v="month">Mánuður</button></nav><section class="stats"><div class="stat"><small>Starfsmenn</small><strong id="pc">0</strong></div><div class="stat"><small>Úthlutaðar stöður</small><strong id="ac">0</strong></div><div class="stat"><small>Tímar valins tímabils</small><strong id="hc">0</strong></div></section><div class="layout"><aside class="card"><div class="head"><b>Starfsmenn</b><button class="btn" id="add">+ Bæta við</button></div><div class="body"><p class="sub">Dragðu spjald á stöð.</p><div class="people" id="people"></div></div></aside><section class="card"><div class="head"><b id="title">Vikusýn</b><span class="sub" id="range"></span></div><div id="content"></div></section></div></main><script>
const R=[['Móttaka','Koma og skráning','#7357dc'],['Útisvæði','Stóri garður','#0b9278'],['Litli garður','Sandkassi','#e08a22'],['Kósý garður','Leynigarður','#d5536b'],['Föndur','Föndur og fjör','#a43fc1'],['Music & science','Tilraunir','#2876c8'],['Hugmyndakassi','Hugmyndir','#8a6a35'],['Matsalur','Matur','#51606f'],['Sandkassar','Sandleikur','#9b7b45'],['Hreyfing','Pogo og hreyfing','#e0492f'],['Námsaðstoð','Heimanám','#3d7c98'],['Sérstuðningur','Einstaklingsstuðningur','#c13d82'],['Afleysing','Flot','#65717e'],['Lokavakt','Lokun','#344054']],N=['Anna','Björn','Elín','Guðrún','Jón','Katrín','Magnús','Sara'],K='vakt-visual-v2';let S=load(),V='week';function d(x){return x.toISOString().slice(0,10)}function fresh(){let x=new Date();return{from:d(x),to:d(new Date(x.getTime()+6*864e5)),people:N,assign:{},preset:'2',theme:'unicorn'}}function load(){try{return JSON.parse(localStorage.getItem(K))||fresh()}catch(e){return fresh()}}function save(){localStorage.setItem(K,JSON.stringify(S))}function ds(){let a=new Date(S.from+'T12:00'),b=new Date(S.to+'T12:00'),o=[];for(;a<=b;a.setDate(a.getDate()+1))o.push(d(a));return o}function fmt(x){return new Intl.DateTimeFormat('is-IS',{weekday:'short',day:'numeric',month:'short'}).format(new Date(x+'T12:00'))}function key(x,i){return x+'_'+i}function list(x,i){return S.assign[key(x,i)]||[]}function hours(){if(S.preset==='custom'){let a=$('cf').value.split(':').map(Number),b=$('ct').value.split(':').map(Number);return b[0]+b[1]/60-a[0]-a[1]/60}return +S.preset}function time(){return S.preset==='2'?'14:00–16:00':S.preset==='4'?'13:30–17:30':$('cf').value+'–'+$('ct').value}function paint(){let t=S.theme,c=t==='stars'?['#e1eaff','#111827']:t==='christmas'?['#ffe2e2','#b21f35']:t==='unicorn'?['#ffe3fa','#a83dbb']:['#fff','#7357dc'];document.documentElement.style.setProperty('--theme1',c[0]);document.documentElement.style.setProperty('--a',c[1])}function people(){let p=$('people');p.innerHTML=S.people.map((n,i)=>'<div class="person" draggable="true" data-n="'+n+'" style="--c:'+R[i%14][2]+'"><b>'+n+'</b><small>Dragðu á stöð</small></div>').join('');p.querySelectorAll('.person').forEach(x=>x.ondragstart=e=>e.dataTransfer.setData('n',x.dataset.n))}function render(){paint();$('from').value=S.from;$('to').value=S.to;$('preset').value=S.preset;$('theme').value=S.theme;people();let z=ds(),count=Object.values(S.assign).flat().length;$('pc').textContent=S.people.length;$('ac').textContent=count;$('hc').textContent=(count*hours()).toFixed(1)+' klst.';$('range').textContent=z.length?fmt(z[0])+' – '+fmt(z.at(-1)):'';V==='week'?week(z):month(z)}function week(z){$('title').textContent='Vikusýn';let h='<div class="week">';z.forEach(x=>{h+='<div class="day"><h3>'+fmt(x)+'</h3><div class="stations">';R.forEach((r,i)=>{h+='<div class="station" data-d="'+x+'" data-r="'+i+'"><b>'+r[0]+'</b><p>'+r[1]+'</p><div class="dropcards">'+list(x,i).map(n=>'<div class="person" style="--c:'+r[2]+'"><b>'+n+'</b><small>'+time()+'</small></div>').join('')+'</div></div>'});h+='</div></div>'});$('content').innerHTML=h+'</div>';document.querySelectorAll('.station').forEach(s=>{s.ondragover=e=>{e.preventDefault();s.classList.add('over')};s.ondragleave=()=>s.classList.remove('over');s.ondrop=e=>{let n=e.dataTransfer.getData('n'),x=s.dataset.d,i=+s.dataset.r;Object.keys(S.assign).forEach(k=>S.assign[k]=(S.assign[k]||[]).filter(v=>v!==n));S.assign[key(x,i)]=[...(S.assign[key(x,i)]||[]),n];save();render()}})}function month(z){$('title').textContent='Mánuður';let q=new Date((z[0]||S.from)+'T12:00'),y=q.getFullYear(),m=q.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,max=new Date(y,m+1,0).getDate(),h='<div class="month"><h2>'+new Intl.DateTimeFormat('is-IS',{month:'long',year:'numeric'}).format(q)+'</h2><div class="monthgrid">'+['mán','þri','mið','fim','fös','lau','sun'].map(x=>'<div class="head">'+x+'</div>').join('');for(let i=0;i<first;i++)h+='<div></div>';for(let n=1;n<=max;n++){let x=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),c=Object.keys(S.assign).filter(k=>k.startsWith(x+'_')).reduce((a,k)=>a+S.assign[k].length,0);h+='<div class="has"><b>'+n+'</b><small style="display:block;color:#687582">'+c+' stöður</small></div>'}$('content').innerHTML=h+'</div></div>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');V=b.dataset.v;render()});$('apply').onclick=()=>{S.from=$('from').value;S.to=$('to').value;S.preset=$('preset').value;S.theme=$('theme').value;save();render()};$('theme').onchange=e=>{S.theme=e.target.value;save();render()};$('add').onclick=()=>{let n=prompt('Nafn starfsmanns:');if(n&&n.trim()&&!S.people.includes(n.trim())){S.people.push(n.trim());save();render()}};$('demo').onclick=()=>{S=fresh();ds().forEach((x,j)=>S.people.forEach((n,i)=>{if(i<7)S.assign[key(x,i)]=[n]}));save();render()};$('clear').onclick=()=>{if(confirm('Hreinsa allt?')){S=fresh();save();render()}};render();</script></html>
